[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-engine"
version = "0.1.0"
description = "Reproducible equity research data foundations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0", "yfinance>=0.2.40,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
